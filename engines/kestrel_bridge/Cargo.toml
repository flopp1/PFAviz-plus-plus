[package]
name = "kestrel_bridge"
version = "0.9.0"
edition = "2021"
publish = false
description = "Spiderweb's live connection to the Kestrel GPU synth: a C ABI over Kestrel's live render"

[lib]
# cdylib = the DLL Spiderweb loads with ctypes; rlib = for this crate's own tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
# (PFAviz++: the library's warnings collected for kb_take_warnings)
log = "0.4"
# Kestrel = mbms's fork (live interface + "runs inside another process" fix) + our own changes on the branch
# "spiderweb" of github.com/UnPrioritized/kestrel-midi, pinned to one commit. Updating: see the kestrel-update skill.

# (Windows: DirectX 12 through its shader compiler, as Kestrel's own builds; Linux: Vulkan)
[target.'cfg(windows)'.dependencies]
kestrel = { git = "https://github.com/UnPrioritized/kestrel-midi", rev = "4a5f396a7d29a1877bc88f20effd8c88682dcca5", default-features = false, features = ["dx12-dxc"] }

[target.'cfg(not(windows))'.dependencies]
kestrel = { git = "https://github.com/UnPrioritized/kestrel-midi", rev = "4a5f396a7d29a1877bc88f20effd8c88682dcca5", default-features = false }

[dev-dependencies]
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
